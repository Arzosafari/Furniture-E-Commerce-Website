# Base44 sandbox environment for LIVE / NEST.
# Runs the Vite dev server straight from the cloned source so edits hot-reload.
# Nothing here is used in production — the app is a static frontend.

name: live-nest

services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - CI=true npm install --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:3000"
    environment:
      # Passed through from the platform; the Vite config only widens the host
      # allowlist and enables watcher polling when BASE44_PREVIEW_MODE is "1".
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
    restart: on-failure
    labels:
      base44.project: "Live / Nest"
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 75s
